<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iconfont的基本使用</title>
  <link rel="stylesheet" href="iconfont/iconfont.css">

  <style>
    .icon-kuaijiezhifu {
      font-size: 40px;
      color: blue;
    }

    .icon-xihuan {
      font-size: 40px;
    }
  </style>
</head>

<body>
  <!-- 
  1、将下载下来的安装包放到当前目录下。
  2、引入iconfont.css文件。
  3、通过类名引入需要的图标，以 【iconfont】开头 空格  打开demo_index.html复制图标类名。
  -->

  <span class="iconfont icon-kuaijiezhifu"></span>
  <span class="iconfont icon-xihuan"></span>
</body>

</html>
