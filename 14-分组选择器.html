<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分组选择器</title>
  <style lang="">
    /* 分组选择器是将不同的选择器组合在一起。使用逗号分割。 */
    div,
    span {
      color: pink;
    }
  </style>
</head>

<body>
  <div>
    小猪
  </div>
  <span>
    佩奇
  </span>
</body>

</html>
