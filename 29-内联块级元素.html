<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内联块级元素</title>
  <style>
    div {
      display: inline-block; /* 内联块级元素 */
      background: lightblue;
      margin: 5px;
      padding: 10px;
      width: 100px;
      height: 50px;
    }
  </style>
</head>

<body>
  <!-- 
  内联块级元素既有块级元素的特点，又有内联元素的特点。
  可以与其他内联元素位于同一行，宽度由内容的长度控制，
  也可以设置宽（width）和高（height），并且还可以设
  置四个方向的padding和margin值。
  -->
  
  <div>div1</div>
  <div>div2</div>
  <div>div3</div>
  普通文本
</body>

</html>
