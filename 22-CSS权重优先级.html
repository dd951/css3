<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #header {
      color: pink;
    }

    .box {
      color: blue;
    }

    div {
      color: red !important;
    }

    h1 {
      font-weight: 400;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="box" id="header" style="color: purple;">CSS权重优先级</div>
  <div class="nav">
    <ul>
      <li><a href="#">首页</a></li>
    </ul>
  </div>

  <!-- 继承的权重是0 -->
  <p><span>文字</span></p>

  <!-- 比如h 和链接 浏览器有自己默认的样式 -->
  <header>
    <h1>我是一级标题</h1>
  </header>
</body>

</html>
